<!DOCTYPE html>
<html class="x-admin-sm">
<head>
    <meta charset="UTF-8">
    <title>隐患列表</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8" />
    <link rel="stylesheet" href="../css/font.css">
    <link rel="stylesheet" href="../css/index.css">
    <script src="../lib/layui/layui.js" charset="utf-8"></script>
    <script type="text/javascript" src="../js/index.js"></script>
    <script type="text/javascript" src="../jly/js/base.js"></script>
    <script type="text/javascript" src="../../js/base.js"></script>
    <script type="text/javascript" src="../../js/printtpl.js"></script>
    <style>
        /* ===== 统计卡片 ===== */
        .stat-card-wrapper {
            margin: 15px;
            border-radius: 8px;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        .stat-card-wrapper .layui-card-body {
            background: transparent !important;
            padding: 0;
        }
        .stat-cards {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 160px;
            background: #fff;
            border-radius: 8px;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #6fb3e0;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
            background: #6fb3e0;
        }
        .stat-card .stat-info .stat-num {
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            color: #6fb3e0;
        }
        .stat-card .stat-info .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .stat-card.stat-overdue { border-left-color: #e74c3c; }
        .stat-card.stat-overdue .stat-icon { background: #e74c3c; }
        .stat-card.stat-overdue .stat-num { color: #e74c3c; }
        .stat-card.stat-cancel { border-left-color: #f39c12; }
        .stat-card.stat-cancel .stat-icon { background: #f39c12; }
        .stat-card.stat-cancel .stat-num { color: #f39c12; }

        /* ===== 整改结果状态标签 ===== */
        .result-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .result-badge.overdue { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6cb; }
        .result-badge.cancel  { background: #fef3e2; color: #e67e22; border: 1px solid #fce4b8; }

        /* ===== 面包屑 ===== */
        .x-nav {
            margin: 0 15px;
            border-radius: 6px 6px 0 0;
        }

        /* ===== 搜索卡片 ===== */
        .search-card {
            margin: 0 15px;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .search-card .layui-card-header {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .search-card .layui-card-header i {
            margin-right: 6px;
            color: #09b4c5;
        }
        .search-card .layui-card-body {
            padding: 20px 30px;
            overflow: visible;
        }
        .search-card .layui-form {
            overflow: visible;
        }
        .search-card .layui-row {
            overflow: visible;
        }
        .search-card .layui-row > [class*="layui-col"] {
            padding-left: 15px !important;
            padding-right: 15px !important;
        }

        /* ===== 表格卡片 ===== */
        .table-card {
            margin: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }

        /* ===== 表格行 hover ===== */
        .layui-table tbody tr:hover {
            background: #f0fafb !important;
        }

        /* ===== 搜索按钮 ===== */
        .search-card .layui-btn {
            border-radius: 4px;
        }
        .search-card .layui-btn-primary {
            border-color: #09b4c5;
            color: #09b4c5;
        }
        .search-card .layui-btn-primary:hover {
            border-color: #078a97;
            color: #078a97;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .stat-card {
                min-width: 45%;
            }
            .stat-card .stat-info .stat-num {
                font-size: 22px;
            }
            .table-card, .search-card, .x-nav {
                margin: 8px 5px;
            }
        }

        /* ==============================
           layer 弹窗标题栏覆盖为 card-header 风格
        ============================== */
        .layui-layer {
            overflow: hidden !important;
            border-radius: 10px !important;
        }

        .layui-layer-title {
            height: auto !important;
            line-height: 1.4 !important;
            /* padding: 14px 20px !important; */
            /* font-size: 18px !important;
            font-weight: 600 !important; */
            /* color: #333 !important; */
            /* background: #fff !important; */
            /* border-bottom: 1px solid #f0f0f0 !important; */
            border-radius: 10px 10px 0 0 !important;

            background: linear-gradient(135deg, #09b4c5 0%, #04564e 100%) !important;;
            color: #fff !important;;
            font-size: 16px !important;;
            font-weight: 600 !important;;
            letter-spacing: 2px !important;;
            padding: 14px 20px !important;;
            border-bottom: none !important;
        }
、
    </style>
</head>

<body>
    <!-- 面包屑导航 -->
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a href="">首页</a>
            <a href="">敬老院消防管理</a>
            <a><cite>隐患列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right" onclick="location.reload()" title="刷新">
            <i class="layui-icon layui-icon-refresh" style="line-height:30px"></i>
        </a>
    </div>

    <!-- 数据统计卡片 -->
    <div class="layui-card stat-card-wrapper">
        <div class="layui-card-body">
        <div class="stat-cards" id="statCards">
        <div class="stat-card" data-status="">
            <div class="stat-icon"><i class="layui-icon layui-icon-list"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="countTotal">0</div>
                <div class="stat-label">隐患总数</div>
            </div>
        </div>
        <div class="stat-card stat-overdue" data-status="超期">
            <div class="stat-icon"><i class="layui-icon layui-icon-warning"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="countOverdue">0</div>
                <div class="stat-label">超期</div>
            </div>
        </div>
        <div class="stat-card stat-cancel" data-status="销号">
            <div class="stat-icon"><i class="layui-icon layui-icon-close"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="countCancel">0</div>
                <div class="stat-label">销号</div>
            </div>
        </div>
    </div>
        </div>
    </div>

    <!-- 搜索区域 -->
    <div class="layui-card search-card">
        <div class="layui-card-header">
            <i class="layui-icon layui-icon-search"></i> 筛选查询
        </div>
        <div class="layui-card-body">
            <form class="layui-form layui-col-space10">
                <div class="layui-row">
                    <div class="layui-col-md2">
                        <input type="text" id="check_date" name="check_date" placeholder="排查日期" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-col-md2">
                        <input type="text" id="safety_investigator" name="safety_investigator" placeholder="排查人员" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-col-md2">
                        <input type="text" id="position" name="position" placeholder="隐患位置" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-col-md2">
                        <input type="text" id="reviewer" name="reviewer" placeholder="责任人" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-col-md2">
                        <input type="text" id="rectification_no" name="rectification_no" placeholder="整改单号" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-col-md2">
                        <select name="rectification_result" id="rectification_result">
                            <option value="">整改结果</option>
                            <option value="超期">超期</option>
                            <option value="销号">销号</option>
                        </select>
                    </div>
                </div>
                <div class="layui-row" style="margin-top:10px;">
                    <div class="layui-col-md12">
                        <button class="layui-btn" lay-submit="" type="button" lay-filter="sreach">
                            <i class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button class="layui-btn layui-btn-primary" type="button" id="btnReset">
                            <i class="layui-icon layui-icon-refresh"></i> 重置
                        </button>
                        <button class="layui-btn layui-btn-warm" lay-submit="" type="button" lay-filter="add">
                            <i class="layui-icon layui-icon-add-1"></i> 登记隐患
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="layui-card table-card">
        <div class="layui-card-body" style="padding:0;">
            <table class="layui-hide" id="demo" lay-filter="danger_table"></table>
        </div>
    </div>

    <!-- 行工具栏模板 -->
    <script type="text/html" id="fieldtool">
        <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 处理</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete"><i class="layui-icon layui-icon-delete"></i> 删除</a>
    </script>

    <!-- 照片预览模板 -->
    <script type="text/html" id="photoTpl">
        {{# var photos = d.DangerPhoto ? d.DangerPhoto.split(';').filter(function(p){ return p; }) : []; }}
        {{# if(photos.length > 0){ }}
        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="photos">
            <i class="layui-icon layui-icon-picture"></i> 查看({{photos.length}})
        </a>
        {{# } else { }}
        <span style="color:#ccc;">无</span>
        {{# } }}
    </script>

    <!-- 整改结果模板 -->
    <script type="text/html" id="resultTpl">
        {{# if(d.RectificationResult === '超期'){ }}
        <span class="result-badge overdue">超期</span>
        {{# } else if(d.RectificationResult === '销号'){ }}
        <span class="result-badge cancel">销号</span>
        {{# } else if(d.RectificationResult === '待整改'){ }}
        <span class="result-badge cancel">待整改</span>
        {{# } else { }}
        <span style="color:#ccc;">-</span>
        {{# } }}
    </script>

    <script>
        var search_data = { safety_investigator: "", position: "", reviewer: "", check_date: "", rectification_result: "", rectification_no: ""};

        layui.use(['table', 'laydate', 'form', 'layer'], function () {
            var table = layui.table;
            var laydate = layui.laydate;
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.$;

            // 渲染日期选择器
            laydate.render({
                elem: '#check_date',
                type: 'date',
                format: 'yyyy-MM-dd',
                done: function () {
                    doSearch();
                }
            });

            $.ajaxSetup({
                headers: { 'Access-Control-Allow-Origin': Domain },
                xhrFields: { withCredentials: true }
            });

            // 渲染表格
            var tableIns = table.render({
                elem: '#demo',
                height: 'full-200',
                url: BasePathJLY + '/getdangers',
                method: 'post',
                page: true,
                even: true,
                cellMinWidth: 80,
                id: "dangers",
                title: "消防隐患列表",
                limits: [10, 20, 30, 50, 100],
                limit: 20,
                cols: [[
                    { field: 'Id', title: '#', align: 'center', width: 50, fixed: 'left' },
                    { field: 'CheckDate', title: '排查日期', align: 'center', width: 110,
                      templet: function(d){ return d.CheckDate ? d.CheckDate.substring(0,10) : ''; }},
                    { field: 'SafetyInvestigator', title: '排查人员', align: 'center', width: 100 },
                    { field: 'Position', title: '隐患位置', align: 'center', width: 130 },
                    { field: 'Description', title: '隐患描述', align: 'left', minWidth: 200, width: 570 },
                    { field: 'DangerReviewer', title: '责任人', align: 'center', width: 100 },
                    { field: 'RectificationNo', title: '整改单号', align: 'center', width: 130 },
                    { field: 'RectificationResult', title: '整改结果', align: 'center', width: 110, templet: '#resultTpl' },
                    { title: '现场照片', align: 'center', width: 110, templet: '#photoTpl' },
                    { title: '操作', align: 'center', width: 180, fixed: 'right', templet: '#fieldtool' }
                ]],
                parseData: function (res) {
                    console.log( res.data)
                    if (res.code == 0) {
                        var data = res.data && res.data[0] ? res.data[0] : [];
                        var overdue = 0, cancel = 0;
                        data.forEach(function(item) {
                            if (item.RectificationResult === '超期') overdue++;
                            else if (item.RectificationResult === '销号') cancel++;
                        });
                        $('#countTotal').text(res.count || 0);
                        $('#countOverdue').text(overdue);
                        $('#countCancel').text(cancel);
                        return {
                            "code": res.code,
                            "msg": res.message,
                            "count": res.count,
                            "data": data
                        };
                    }
                    if (res.code == 1001) {
                        window.top.location.href = "../../index.html";
                    }
                    return {
                        "code": res.code,
                        "msg": res.message,
                        "count": 0,
                        "data": []
                    };
                }
            });

            // 统计卡片点击筛选（总数：清空所有；超期/销号：按整改结果筛选）
            $('#statCards').on('click', '.stat-card', function () {
                var status = $(this).data('status');
                $('#safety_investigator').val('');
                $('#position').val('');
                $('#reviewer').val('');
                $('#check_date').val('');
                if (status) {
                    $('#rectification_result').val(status);
                    form.render('select');
                } else {
                    $('#rectification_result').val('');
                    form.render('select');
                }
                doSearch();
            });

            // 行工具事件
            table.on('tool(danger_table)', function (obj) {
                var data = obj.data;
                if (obj.event === 'edit') {
                    layer.open({
                        type: 2,
                        area: ['1000px', '600px'],
                        fixed: false,
                        maxmin: false,
                        title: false,
                        /* title: '敬老院消防管理-隐患-编辑', */
                        content: 'danger-detail.html?id=' + data.Id,
                        success:function(layero,index){
                            var body = layer.getChildFrame('body', index);
                            layer.full(index);
                        },
                        end: function(){
                            layui.data('danger_data', {key: data.Id, remove: true});
                        }
                    });
                } else if (obj.event === 'delete') {
                    layer.confirm('确定删除该隐患记录吗？', { icon: 3, title: '提示' }, function (index) {
                        layer.close(index);
                        var loadIdx = layer.load(1);
                        $.ajax({
                            type: "post",
                            url: BasePathJLY + '/deletedanger',
                            data: { id: data.Id },
                            dataType: "json",
                            success: function (res) {
                                if (res.code == 0) {
                                    layer.msg('删除成功', { icon: 1 });
                                    table.reload('dangers');
                                } else {
                                    layer.msg(res.msg || '删除失败', { icon: 2 });
                                }
                            },
                            error: function () {
                                layer.msg('删除失败，请重试', { icon: 2 });
                            },
                            complete: function () {
                                layer.close(loadIdx);
                            }
                        });
                    });
                } else if (obj.event === 'photos') {
                    // 查看照片（DangerPhoto 为分号分隔的字符串）
                    var photoStr = data.DangerPhoto || '';
                    var photos = photoStr ? photoStr.split(';').filter(function(p){ return p; }) : [];
                    if (photos.length > 0) {
                        var photoHtml = '<div style="display:flex;flex-wrap:wrap;gap:10px;padding:10px;justify-content:center;">';
                        photos.forEach(function (p) {
                            photoHtml += '<img src="' + BasePathJLY.replace('/jly','') + '/dangerphoto/' + p + '" style="max-width:600px;max-height:600px;border-radius:6px;border:1px solid #eee;">';
                        });
                        photoHtml += '</div>';
                        layer.open({
                            type: 1,
                            area: ['1000px', '740px'],
                            title: '隐患照片',
                            content: photoHtml,
                        });
                    }
                }
            });

            // 搜索
            form.on('submit(sreach)', function () {
                doSearch();
                return false;
            });

            // 添加
            form.on('submit(add)', function () {
                onAddDanger();
                return false;
            });

            // 重置
            $('#btnReset').on('click', function () {
                $('#safety_investigator').val('');
                $('#position').val('');
                $('#reviewer').val('');
                $('#check_date').val('');
                $('#rectification_result').val('');
                $('#rectification_no').val('');
                form.render('select');
                search_data = { safety_investigator: "", position: "", reviewer: "", check_date: "", rectification_result: "", rectification_no: ""};
                table.reload('dangers', { where: {} });
            });

            // 回车搜索
            ['#safety_investigator', '#position', '#reviewer'].forEach(function (sel) {
                $(sel).keypress(function (e) {
                    if (e.which == key_enter) doSearch();
                });
            });

            function doSearch() {
                var si = $('#safety_investigator').val();
                var po = $('#position').val();
                var re = $('#reviewer').val();
                var cd = $('#check_date').val();
                var dr = $('#rectification_result').val();
                var rn = $('#rectification_no').val();

                if (si == search_data.safety_investigator &&
                    po == search_data.position &&
                    re == search_data.reviewer &&
                    cd == search_data.check_date &&
                    dr == search_data.rectification_result &&
                    rn == search_data.rectification_no) {
                    return;
                }

                search_data.safety_investigator = si;
                search_data.position = po;
                search_data.reviewer = re;
                search_data.check_date = cd;
                search_data.rectification_result = dr;
                search_data.rectification_no = rn;

                if (!si && !po && !re && !cd && !dr && !rn) {
                    table.reload('dangers', { where: {} });
                    return;
                }

                var where = {};
                if (si) where.safety_investigator = si;
                if (po) where.position = po;
                if (re) where.reviewer = re;
                if (cd) where.check_date = cd;
                if (dr) where.rectification_result = dr;
                if (rn) where.rectification_no = rn;
                table.reload('dangers', { where: where });
            }

            function onAddDanger() {
                layer.open({
                    type: 2,
                    area: ['1000px', '760px'],
                    fixed: false,
                    maxmin: false,
                    //title: '敬老院消防管理-隐患-添加',
                    title: '<i class="layui-icon layui-icon-survey"></i> 消防隐患登记表',
                    content: 'danger-add.html',
                    scrollbar: false,
                });
            }
        });
    </script>
</body>
</html>
