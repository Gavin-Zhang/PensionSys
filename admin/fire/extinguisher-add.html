<!DOCTYPE html>
<html class="x-admin-sm">
<head>
    <meta charset="utf-8">
    <title>
        基本信息

<body>

<div class="layui-card">
    <form class="layui-form layui-form-pane" action="" id="register" lay-filter="register">
        <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
			<input type="hidden" id="from">
			
			<br>
			<div class="layui-tab-item layui-show">
				<div class="layui-form-item">
					<div>
						<label class="layui-form-label">	
							<span class='x-red'>*</span>编号
						</label>
						<div class="layui-input-block">
							<input type="text" id="extinguisher_code" name="extinguisher_code" lay-verify="required" value="" class="layui-input">
						</div>
					</div>
					<div>
						<label class="layui-form-label">
							<span class='x-red'>*</span>区域
						</label>
						<div class="layui-input-block">
							<input type="text" name="area" id="area" lay-verify="required" value="" class="layui-input">
						</div>
					</div>
					<div>
						<label class="layui-form-label">
							<span class='x-red'>*</span>位置
						</label>
						<div class="layui-input-block">
							<input type="text" name="location" id="location" lay-verify="required" value="" class="layui-input">
						</div>
					</div>
					<div>
						<label class="layui-form-label">
							<span class='x-red'>*</span>类型
						</label>
						<div class="layui-input-block">
							<input type="text" name="type" id="type" lay-verify="required" value="MFZ/ABC5 干粉" class="layui-input">
						</div>
					</div>
					<div>
						<label class="layui-form-label">
							<span class='x-red'>*</span>规格
						</label>
						<div class="layui-input-block">
							<select name="specification" id="specification" lay-verify="required">
								<option value="5KG">5KG</option>
								<option value="3KG">3KG</option>
							</select>
						</div>
					</div>
					<div>
						<label class="layui-form-label">
							<span class='x-red'>*</span>有效期
						</label>
						<div class="layui-input-block">
							<input type="text" name="validity_years" id="validity_years" lay-verify="required number" value="5" class="layui-input">
						</div>
					</div>
					<div>
						<label for="production_date" class="layui-form-label">
							<span class='x-red'>*</span>生产日期
						</label>
						<div class="layui-input-inline">
							<input type="text" autocomplete="off" id="production_date" name="production_date" lay-verify="required" class="layui-input" placeholder="生产日期">
						</div>
					</div>
					<div>
						<label for="expiry_date" class="layui-form-label">
							<span class='x-red'>*</span>到期日期
						</label>
						<div class="layui-input-inline">
							<input type="text" autocomplete="off" id="expiry_date" name="expiry_date" lay-verify="required" class="layui-input" placeholder="到期日期" disabled>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<button class="layui-btn layui-btn-fluid"  type="button" lay-filter="add" lay-submit="">
						提交
					</button>
				</div>
			</div>
        </div>
    </form>
</div>

<!--工具栏模板-->

					laydate.render({
						elem: '#expiry_date'
						,id:'expiry_date_inst'
						,isInitValue: true
						,type: 'date'
						,value: newDate
					});
				}
			}
		});

					console.log(data)
                    if(data.code==0){
                        layer.msg("添加成功", {icon: 6,time:2000},function () {
                            window.parent.location.reload();

		$(document).keyup(function(event){
			if (event.keyCode == 27) {
			
				var childFrame = window.frames[0];
				console.log(childFrame);
				
				var len = window.frames.length;
				if (len == 0) {
					// 获得frame索引
					var index = parent.layer.getFrameIndex(window.name);
					//关闭当前frame
					parent.layer.close(index);
				} else {
					var childFrame = window.frames[len-1];
					// 获得frame索引
					var index = layer.getFrameIndex(childFrame.name);
					//关闭当前frame
					layer.close(index);
				}
			}
		})
