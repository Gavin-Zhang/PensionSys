<!DOCTYPE html>
<html class="x-admin-sm">
	<head>
		<meta charset="UTF-8">
		<title>总览</title>
		<meta name="renderer" content="webkit">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8" />
		<link rel="stylesheet" href="../css/font.css">
		<link rel="stylesheet" href="../css/index.css">
		<script src="../lib/layui/layui.js" charset="utf-8"></script>
		<script type="text/javascript" src="../js/index.js"></script>
		<script type="text/javascript" src="../jly/js/base.js"></script>
		<script type="text/javascript" src="../../js/base.js"></script>
		<script type="text/javascript" src="../../js/printtpl.js"></script>
	</head>

	<body>
		<div class="x-nav">
			<span class="layui-breadcrumb">
				<a href="">首页</a>
				<a href="">敬老院服务管理</a>
				<a>
				<cite>总览</cite></a>
			</span>
			<a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right" onclick="location.reload()" title="刷新">
				<i class="layui-icon layui-icon-refresh" style="line-height:30px"></i>
			</a>
		</div>

		<div class="layui-fluid">
			<div class="layui-row layui-col-space15">
				<div class="layui-col-md12">
					<div class="layui-card">
						<div class="layui-card-body ">
							<form class="layui-form layui-col-space5">
								<div class="layui-inline layui-show-xs-block">
									<input type="text" id="code" name="code"  placeholder="编号" autocomplete="off" class="layui-input">
								</div>
								<div class="layui-inline layui-show-xs-block">
									<input type="text" id="area" name="area"  placeholder="区域"  autocomplete="off" class="layui-input">
								</div>
								<div class="layui-inline layui-show-xs-block">
									<input type="text" id="location" name="location"  placeholder="位置" autocomplete="off" class="layui-input">
								</div>
								<div class="layui-inline layui-show-xs-block">
									<input type="text" id="specification" name="specification"  placeholder="规格" autocomplete="off" class="layui-input">
								</div>
								<div class="layui-inline layui-show-xs-block">
									<button class="layui-btn"  lay-submit="" type="button" lay-filter="sreach"><i class="layui-icon">&#xe615;</i></button>
								</div>
								<div class="layui-inline layui-show-xs-block">
									<button class="layui-btn"  lay-submit="" type="button" lay-filter="add"><i class="layui-icon">&#xe608;</i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>	

		<table class="layui-hide" id="demo" lay-filter="test"></table>


		<script type="text/html" id="fieldtool">
			<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="op">操作</a>
		</script>

		<script>
			let search_data = {code: "", area: "", location: "", specification: ""};
			layui.use(['table', 'laydate','form'], function(){
				var table = layui.table
				var laydate = layui.laydate;
				var form = layui.form;

			
				$.ajaxSetup({
					headers: {'Access-Control-Allow-Origin' : Domain,},
					xhrFields: {withCredentials: true},
				});
			
				table.render({
					elem: '#demo'
					,height: 'full-150'//,height: 420
					,url: BasePathJLY + '/getextinguisher'	
					,method: 'post'
					,page: true //开启分页
					//,toolbar: 'default' //开启工具栏，此处显示默认图标，可以自定义模板，详见文档
					,defaultToolbar: ['filter', 'exports', 'print']
					,even: true //开启隔行背景
					//,totalRow: true //开启合计行
					,cellMinWidth: 100 //全局定义常规单元格的最小宽度，layui 2.2.1 新增
					,id:"extinguishers"
					,title:"列表"
					,limits:[10,20,30,50,100,150,200,300,400,500,1000]
					,limit: 20
					,cols: [[
						{field:'ExtinguisherCode', title: '编号', align:'center', width: '20%', fixed: 'left'}
						,{field:'Area', title: '区域', align:'center', width: '15%'}
						,{field:'Location', title: '位置', align:'center', width: '15%'} 
						,{field:'Specification', title: '规格', align:'center', width: '10%' }
						,{field:'ProductionDate', title: '生产日期', align:'center', width: '20%'}
						,{field:'ExpiryDate', title: '到期日期', align:'center', width: '20%'}
					]]
					,parseData: function(res){ //res 即为原始返回的数据
						if (res.code == 0) {
							console.log("======>", res)
							for(var tableitem of res.data[0]) {
								tableitem.ExpiryDate = tableitem.ExpiryDate.substring(0,10)
								tableitem.ProductionDate = tableitem.ProductionDate.substring(0,10)
							}

							return {
							"code": res.code, //解析接口状态
							"msg": res.message, //解析提示文本
							"count": res.count, //解析数据长度
							"data": res.data[0] //解析数据列表
							};
						}
						if (res.code == 1001) {
							window.top.location.href = "../../index.html";
						}
						return {
						"code": res.code, //解析接口状态
						"msg": res.message, //解析提示文本
						"count": res.count, //解析数据长度
						"data": [] //解析数据列表
						};
					}
					,done: function(res, curr, count){

					}
				});
			
				//监听提交
				form.on('submit(sreach)', function(data){
					sreachExtinguisher();
				});
				form.on('submit(add)', function(data){
					onAddExtinguisher();
				});
				$("input[name='code']").keypress(function (e) {
					if (e.which == key_enter) {
						sreachExtinguisher()
					}
				});
				$("input[name='area']").keypress(function (e) {
					if (e.which == key_enter) {
						sreachExtinguisher()
					}
				});
				$("input[name='location']").keypress(function (e) {
					if (e.which == key_enter) {
						sreachExtinguisher()
					}
				});
				$("input[name='specification']").keypress(function (e) {
					if (e.which == key_enter) {
						sreachExtinguisher()
					}
				});
				
				form.verify({
					chinaid: function(value, item){
						if(!new RegExp("/^[1-9]\d{5}(19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[\d|X|x]$").test(value)){
						return '身份证不正确';
						}
					}
				})
			});
		
			function onAddExtinguisher() {
				layer.open({
					type: 2,
					area: ['900px', '600px'],
					fixed: false, //不固定
					maxmin: true,
					title: "敬老院消防管理-灭火器-添加",
					content: 'extinguisher-add.html',
				});
			}

			function sreachExtinguisher() {
				var code = layui.$('#code').val()
				var area = layui.$('#area').val()
				var location = layui.$('#location').val()
				var specification =layui.$('#specification').val()
				
				if (code == search_data.code && 
					area == search_data.area && 
					location == search_data.location &&
					specification == search_data.specification) {
					return;
				}

				search_data.code = code;
				search_data.area = area;
				search_data.location = location;
				search_data.specification = specification;
				if (code == "" && area == "" && location == "" && specification == "") {
					layui.table.reload('extinguishers', {where:{}})
					return;
				}

				let where = {}
				if (code != "") {
					where.code = code
				}
				if (area != "") {
					where.area = area
				}
				if (location != "") {
					where.location = location
				}
				if (specification!= "") {
					where.specification = specification
				}
				layui.table.reload('extinguishers', { where: where })
			}

		</script>
	</body>
</html>
