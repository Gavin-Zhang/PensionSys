<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../../layui/layui.js" charset="utf-8"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm 14mm 10mm 14mm;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "SimSun", "宋体", serif;
            font-size: 15px;
            color: #000;
            background: #fff;
            line-height: 1.8;
        }
        .print-wrap {
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            padding: 5mm 5mm;
        }
        .header-area {
            position: relative;
            text-align: center;
            margin-bottom: 14px;
            font-size: 13px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ccc;
        }
        .header-no {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            min-width: 180px;
            text-align: right;
        }
        .print-title {
            display: inline-block;
            font-size: 22px;
            font-family: "SimHei", "黑体", sans-serif;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 0;
        }
        .print-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .print-table td, .print-table th {
            border: 1px solid #000;
            padding: 10px 6px;
            font-size: 14px;
            word-break: break-all;
            vertical-align: middle;
            line-height: 1.7;
        }
        .print-table td.row-tall {
            text-align: left;
            padding-top: 24px;
            padding-bottom: 24px;
            vertical-align: top;
        }
        .print-table .cate-col {
            width: 12%;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 16px;
            background: #f0f0f0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .print-table .label-col,
        .print-table .label-col2 {
            width: 14%;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            font-size: 15px;
            background: #fafafa;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .print-table .value-col {
            width: 24%;
            text-align: center;
            padding-left: 12px;
        }
        .print-table .value-col2 {
            width: 36%;
            text-align: center;
            padding-left: 12px;
        }
        .print-table .photo-cell {
            text-align: center;
            vertical-align: middle;
            padding: 10px 6px;
        }
        .photo-row-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .photo-row-wrap img {
            width: 320px;
            height: 180px;
            border: 1px solid #ccc;
            object-fit: cover;
        }
        .no-photo-text {
            color: #999;
            font-style: italic;
            font-size: 14px;
        }
        .check-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
        }
        .check-list span {
            white-space: nowrap;
            font-size: 15px;
        }
        .check-list .checked {
            color: #000;
            font-weight: bold;
        }
        .check-list .unchecked {
            color: #999;
        }

        /* 打印按钮 */
        .print-btn-area {
            text-align: center;
            margin: 20px 0;
        }
        .print-btn-area .layui-btn {
            min-width: 120px;
        }

        @media print {
            .print-btn-area { display: none !important; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-wrap { padding: 0; }
            .header-area { border-bottom: none; }
        }
    </style>
</head>
<body>
    <!-- <div class="print-btn-area">
        <button class="layui-btn layui-btn-normal" id="btnDoPrint"><i class="layui-icon layui-icon-print"></i> 打 印</button>
    </div> -->
    <div class="print-wrap">
        <div class="header-area">
            <div class="print-title">隐患整改记录</div>
            <div class="header-no">整改单号：<span id="headerNo"></span></div>
        </div>
        <table class="print-table">
            <tbody id="printBody"></tbody>
        </table>
    </div>

    <script>
    layui.use([], function () {
        var $ = layui.$;
        var data = JSON.parse(layui.sessionData('danger_print').printdata || '{}');
        var RecInfo = data.RecInfo || {};
        var baseUrl = (window.parent && window.parent.BasePathJLY) ? window.parent.BasePathJLY : '';
        console.log(data);

        // 整改单号
        $('#headerNo').text(data.RectificationNo || '—');

        // 格式化日期
        function fmtDate(val) {
            if (!val) return '';
            var d = new Date(val);
            if (isNaN(d.getTime())) {
                var s = String(val);
                return s.length >= 10 ? s.substring(0, 10) : s;
            }
            return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
        }

        // 等级映射
        function fmtLevel(level) {
            var map = { '1': '一般', '2': '较大', '3': '重大', '一般': '一般', '较大': '较大', '重大': '重大' };
            return map[level] || level || '';
        }

        // 整改状态映射（每行3项）
        function fmtRectifyState(state) {
            console.log(state);
            var options = ['待整改', '整改中', '超期', '销号'];
            var current = state || '';
            var spans = options.map(function (opt) {
                var isChecked = (current.indexOf(opt) !== -1 || current === opt);
                return '<span class="' + (isChecked ? 'checked' : 'unchecked') + '">' +
                    (isChecked ? '\u2611' : '\u2610') + ' ' + opt + '</span>';
            });
            var lines = [];
            for (var i = 0; i < spans.length; i += 3) {
                lines.push(spans.slice(i, i + 3).join('&nbsp;&nbsp;&nbsp;'));
            }
            return lines.join('<br>');
        }

        // 复查结果映射
        function fmtReviewResult(result) {
            var options = ['待整改', '整改中', '已验收'];
            var current = result || '';
            return options.map(function (opt) {
                var isChecked = (current === opt || current.indexOf(opt) !== -1);
                return '<span class="' + (isChecked ? 'checked' : 'unchecked') + '">' +
                    (isChecked ? '\u2611' : '\u2610') + ' ' + opt + '</span>';
            }).join('&nbsp;&nbsp;&nbsp;');
        }

        // 渲染照片
        function renderPhotos(photos) {
            if (!photos || !photos.length) {
                return '<span class="no-photo-text">（无）</span>';
            }
            var html = '<div class="photo-row-wrap">';
            $.each(photos, function (i, p) {
                var src = baseUrl + '/dangerphoto/' + p;
                html += '<img src="' + src + '" onerror="this.style.display=\'none\'">';
            });
            html += '</div>';
            return html;
        }

        // 双字段行：categoryCell, label, value, label2, value2
        function row2(label, value, label2, value2) {
            return '<td class="label-col">' + label + '</td>' +
                '<td class="value-col">' + value + '</td>' +
                '<td class="label-col2">' + label2 + '</td>' +
                '<td class="value-col2">' + value2 + '</td>';
        }

        // 单字段占满行（value 占后3列），tall=true 时行高加大
        function row1(label, value, tall) {
            if (tall) {
                return '<td class="label-col">' + label + '</td>' +
                    '<td class="value-col row-tall" colspan="3" style="white-space:pre-wrap;word-break:break-word;">' + value + '</td>';
            }
            return '<td class="label-col">' + label + '</td>' +
                '<td class="value-col" colspan="3">' + value + '</td>';
        }

        // 照片行
        function rowPhoto(label, photos) {
            return '<td class="label-col">' + label + '</td>' +
                '<td class="photo-cell" colspan="3">' + renderPhotos(photos) + '</td>';
        }

        // 分类标题单元格
        function cate(title, rs) {
            return '<td class="cate-col" rowspan="' + rs + '">' + title + '</td>';
        }

        var html = '';

        // ===== 排查信息 (2行) =====
        html += '<tr>' + cate('排查<br>信息', 2) + row2('排查时间', fmtDate(data.CheckDate), '排查类型', data.CheckType || '—') + '</tr>';
        html += '<tr>' + row1('排查人员', data.SafetyInvestigator || '—') + '</tr>';

        // ===== 隐患详情 (3行) =====
        html += '<tr>' + cate('隐患<br>详情', 3) + row2('隐患位置', data.Position || '—', '隐患等级', fmtLevel(data.Level)) + '</tr>';
        html += '<tr>' + row1('隐患详情', data.Description || '—', true) + '</tr>';
        html += '<tr>' + rowPhoto('隐患照片', data.SelectedDangerPhotos) + '</tr>';

        // ===== 整改信息 (3行) =====
        html += '<tr>' + cate('整改<br>信息', 3) + row1('整改措施', RecInfo.RectificationMeasures || '—', true) + '</tr>';
        html += '<tr>' + row2('整改责任人', RecInfo.RectificationPersonnel || '—', '整改期限', fmtDate(RecInfo.RectificationPeriod)) + '</tr>';
        html += '<tr>' + row1('维修单号', data.RepairNo || '—') + '</tr>';

        // ===== 复查验收 (4行) =====
        html += '<tr>' + cate('复查<br>验收', 4) + row2('复查人', RecInfo.Reviewer || '—', '复查时间', fmtDate(RecInfo.ReviewDate)) + '</tr>';
        html += '<tr>' + row1('复查结果', '<div class="check-list">' + fmtReviewResult(RecInfo.ReviewResult) + '</div>') + '</tr>';
        html += '<tr>' + rowPhoto('复查照片', data.SelectedRectifyPhotos) + '</tr>';
        html += '<tr>' + row1('整改状态', '<div class="check-list">' + fmtRectifyState(data.RectificationState) + '</div>') + '</tr>';

        $('#printBody').html(html);

        // 打印按钮
        // $('#btnDoPrint').on('click', function () {
        //     $('.print-btn-area').hide();
        //     window.print();
        //     setTimeout(function () {
        //         $('.print-btn-area').show();
        //     }, 500);
        // });
    });
    </script>
</body>
</html>
